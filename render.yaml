services:
  - type: web
    name: capstone-react-agent
    runtime: docker
    dockerfile: Dockerfile
    plan: free # Can be upgraded to starter/standard
    region: oregon # Render region
    numInstances: 1
    
    # Port must match the port exposed by Gradio / Dockerfile
    port: 7860
    
    # Environment variables set securely in the Render Dashboard
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false # Set manually in Render UI
      - key: SERPER_API_KEY
        sync: false # Set manually in Render UI
      - key: OPENWEATHER_API_KEY
        sync: false # Set manually in Render UI
      - key: PYTHON_ENV
        value: production
        
    # Set up a persistent disk so SQLite database changes survive deployments!
    # (Note: Persistent disks require a paid Render plan. Uncomment below if upgrading from the Free tier)
    # disk:
    #   name: sqlite-data
    #   mountPath: /app/data
    #   sizeGB: 1
